name: Gerar APK Android 3.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Localizar o projeto 3.0
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Imperio_da_TV_Premium_v3_Projeto_APK.zip"
          if [ -f "$ZIP" ]; then
            mkdir -p projeto-v3
            unzip -q "$ZIP" -d projeto-v3
            SETTINGS=$(find projeto-v3 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          elif [ -f app/src/main/assets/index.html ] && [ -f settings.gradle ]; then
            SETTINGS="./settings.gradle"
          else
            echo "::error::Envie $ZIP à raiz do repositório, sem extrair nem renomear."
            exit 1
          fi
          if [ -z "$SETTINGS" ]; then
            echo "::error::Projeto Gradle não encontrado."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Verificar lógica do jogo
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          node tests/test-game.cjs

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Preparar download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-download
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" apk-download/Imperio-da-TV-3.0.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Imperio-TV-3.0-APK
          path: apk-download/Imperio-da-TV-3.0.apk
          if-no-files-found: error
          retention-days: 30
