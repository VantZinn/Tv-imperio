name: Gerar APK TV Empire Beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Node 24 para os testes
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Localizar o projeto beta
        shell: bash
        run: |
          set -euo pipefail
          BETA_ZIP="TV_Empire_Beta_Projeto_APK.zip"
          if [ -f "$BETA_ZIP" ]; then
            mkdir -p projeto-beta
            unzip -q "$BETA_ZIP" -d projeto-beta
            BETA_SETTINGS=$(find projeto-beta -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          elif [ -f app/src/main/assets/index.html ] && [ -f settings.gradle ]; then
            BETA_SETTINGS="./settings.gradle"
          else
            echo "::error::Envie $BETA_ZIP à raiz do repositório, sem extrair nem renomear."
            exit 1
          fi
          if [ -z "$BETA_SETTINGS" ]; then
            echo "::error::Projeto Gradle não encontrado."
            exit 1
          fi
          echo "BETA_PROJECT_DIR=$(dirname "$BETA_SETTINGS")" >> "$GITHUB_ENV"

      - name: Verificar lógica do jogo
        shell: bash
        run: |
          cd "$BETA_PROJECT_DIR"
          node tests/test-game.cjs

      - name: Compilar APK
        shell: bash
        run: |
          cd "$BETA_PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Preparar download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-download
          cp "$BETA_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" apk-download/TV-Empire-Beta.apk

      - name: Disponibilizar APK beta
        uses: actions/upload-artifact@v7
        with:
          name: TV-Empire-Beta-APK
          path: apk-download/TV-Empire-Beta.apk
          if-no-files-found: error
          retention-days: 30
