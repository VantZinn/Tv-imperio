   const [id,job]=pendingPlayerSaves.entries().next().value;pendingPlayerSaves.delete(id);

log('NO AR: '+show.name+' T'+ep.season+'E'+ep.number+' — '+compact(audience)+' espectadores; público '+ep.viewers+'/100; críticos '+ep.critics+'/100.');return{show:show.name,episode:ep.number,season:ep.season,viewers:ep.viewers,critics:ep.critics,audience,revenue,controversial:viral}}
function nextWeek(){let reports=[];s.week++;let expense=hiredCost()+overhead();changeCash(-expense,'Folha de pagamento e manutenção');for(let show of s.shows){for(let ep of show.episodes){if(ep.status==='produced'&&ep.airWeek<=s.week&&!s.networks.some(n=>n.id===show.networkId&&n.paused)){reports.push(airEpisode(show,ep))}}
if(show.status==='active'&&seasonCompleted(show)){show.status='between';log(show.name+' concluiu a temporada '+show.season+'. Decida renovar, encerrar ou cancelar.')}}
if(s.week%4===0){s.trend=genres[dice(Math.min(genres.length,3+s.level*2))];log('Nova tendência de audiência: '+s.trend+'.')}
if(s.week%5===0){for(let show of s.shows){if(show.status==='active')show.hype=clamp(show.hype-4,0,75)}}
if(s.cash<0){s.reputation=clamp(s.reputation-3,0,100);log('Atenção: seu império está operando no vermelho!')}
addXP(reports.length*8+2);s.history.push({week:s.week,cash:s.cash,fans:s.fans,viewers:reports.reduce((a,r)=>a+r.audience,0),aired:reports.length});s.history=s.history.slice(-60);currentEnd={week:s.week,expense,reports,net:reports.reduce((a,r)=>a+r.revenue,0)-expense};checkGoals();save();tab='end';render()}
function renew(id){let show=showBy(id);if(!show||show.status!=='between')return;let episodes=show.episodes.filter(e=>e.season===show.season&&e.status==='aired');let avg=episodes.reduce((a,e)=>a+e.viewers,0)/Math.max(1,episodes.length);let own=s.networks.some(n=>n.id===show.networkId);let chance=clamp(30+(avg-40)*1.1+s.reputation*.25,18,96);if(!own&&rand(0,100)>chance){show.status='cancelled';log(networkBy(show.networkId)?.name+' cancelou '+show.name+' após a temporada '+show.season+'.');update();return notice('A emissora recusou a renovação.',true)}show.season++;show.status='active';show.hype=clamp(show.hype+5,5,60);show.episodesPerSeason=6;show.finalSeason=false;show.fee=Math.round(show.fee*1.06);addXP(30);log(show.name+' foi renovada para a temporada '+show.season+'!');update();notice('Renovada para mais uma temporada!')}

function hireTalent(id){let t=talents.find(t=>t.id===id);if(!t||s.hired.includes(id))return;let onboarding=t.salary*2;if(s.cash<onboarding)return notice('Você precisa de '+money(onboarding)+' para a contratação.',true);changeCash(-onboarding,'Contratação: '+t.name);s.hired.push(id);s.counts.hire++;addXP(12);log(t.name+' entrou para sua equipe ('+t.role+').');update();notice(t.name+' foi contratado(a)!')}

function openNetwork(type){if(s.networks.length>=Math.min(4,1+Math.floor(s.level/3)))return notice('Você precisa subir de nível para abrir outra emissora.',true);let def=type==='Streaming'?{name:'Stream Prime',reach:1.15,cost:350000}:{name:'Rede Prime',reach:1.04,cost:220000};if(s.cash<def.cost)return notice('Saldo insuficiente para abrir essa emissora.',true);changeCash(-def.cost,'Abertura de emissora');let n={id:'own'+id(),name:s.name+' '+(type==='Streaming'?'Play':'TV'),type,reach:def.reach+.03*s.level,fee:0,focus:genres.slice(0,3),paused:false};s.networks.push(n);s.counts.network++;addXP(48);log('Você inaugurou '+n.name+'! Agora pode exibir seus próprios programas.');tab='networks';update();notice('Sua emissora foi inaugurada!')}

v><label class="label">${name}</label><select name="dir${i}"><option value="0">${i===0?'Sóbrio':i===1?'Sério':i===3?'Contido':'Tradicional'}</option><option value="1" selected>${i===0?'Equilibrado':i===1?'Moderado':i===3?'Regular':'Equilibrado'}</option><option value="2">${i===0?'Intenso':i===1?'Bem-humorado':i===3?'Ágil':'Experimental'}</option></select></div>`).join('')}</div></details><button class="primary" type="submit">🎥 Produzir T${sh.season}E${done+1}</button></form>`}

function company(){let vals=[{id:'roteiro',name:'Sala de roteiros',desc:'Dá suporte às escolhas narrativas e aumenta o potencial criativo.',symbol:'✍️'},{id:'filmagem',name:'Estúdios de filmagem',desc:'Melhora a qualidade técnica dos episódios.',symbol:'🎥'},{id:'edicao',name:'Pós-produção',desc:'Aprimora montagem, efeitos e acabamento.',symbol:'🎞️'},{id:'marketing',name:'Centro de marketing',desc:'Prepara campanhas e representa a estrutura da empresa.',symbol:'📢'}];let revenues=s.ledger.filter(x=>x.amount>0).reduce((a,x)=>a+x.amount,0);let expenses=s.ledger.filter(x=>x.amount<0).reduce((a,x)=>a-x.amount,0);return`<section class="section"><div class="head"><h2>🏢 Sua empresa</h2><span class="pill orange">Reputação ${s.reputation}/100</span></div><div class="grid"><div class="card"><h3>📊 Visão financeira</h3><div class="mini-grid"><div>Receitas registradas<strong class="good">${money(revenues)}</strong></div><div>Despesas registradas<strong>${money(expenses)}</strong></div><div>Equipe por semana<strong>${money(hiredCost())}</strong></div><div>Manutenção por semana<strong>${money(overhead())}</strong></div></div><div class="line"></div><h3>Fluxo de caixa</h3><p>Últimos ${Math.min(8,s.history.length)} fechamentos</p>${s.history.length?`<div style="display:flex;align-items:end;gap:6px;height:100px">${s.history.slice(-8).map(h=>`<div title="Semana ${h.week}: ${money(h.cash)}" style="flex:1;min-width:0;background:linear-gradient(#72dccc,#3b8c84);height:${Math.max(5,Math.min(100,h.cash/Math.max(...s.history.slice(-8).map(x=>Math.max(1,x.cash)))*100))}%;border-radius:5px 5px 0 0"></div>`).join('')}</div>`:'<p class="muted">Encerre sua primeira semana para acompanhar a evolução.</p>'}</div><div class="card"><h3>🧱 Melhorias do estúdio</h3><p>Uma boa infraestrutura diferencia suas produções.</p><div class="rows">${vals.map(v=>{let level=s.upgrades[v.id];let cost=Math.round(45000*Math.pow(1.72,level));return`<div class="between"><div><b>${v.symbol} ${v.name}</b><div class="muted tiny">Nível ${level}/5 · ${esc(v.desc)}</div></div><button class="secondary" data-upgrade="${v.id}" ${level>=5?'disabled':''}>${level>=5?'Máximo':money(cost)}</button></div>`}).join('')}</div></div></div><div class="card" style="margin-top:12px"><h3>📜 Registro financeiro</h3><div class="scroll"><table class="table"><thead><tr><th>Semana</th><th>Movimento</th><th>Valor</th></tr></thead><tbody>${s.ledger.slice(0,35).map(x=>`<tr><td>${x.week}</td><td>${esc(x.label)}</td><td class="${x.amount>=0?'good':'bad'}">${x.amount>=0?'+':'−'}${money(Math.abs(x.amount))}</td></tr>`).join('')||'<tr><td colspan="3">Sem movimentações</td></tr>'}</tbody></table></div></div></section>`}

function settings(){return`<section class="section"><div class="head"><h2>⚙️ Central de configurações</h2><span class="pill cyan">V2.0 PREMIUM</span></div><p class="subhead">Perfil de usuário, dados e salvamento.</p><div class="rows"><div class="card"><div class="account-detail"><div class="avatar">${esc(account?.username?.[0]?.toUpperCase()||'P')}</div><div><strong>@${esc(account?.username||'')}</strong><small>${account?.type==='cloud'?'☁️ Conta na nuvem · '+'Sincronização '+(syncStatus==='cloud'?'ativa':syncStatus==='offline'?'pendente':'em andamento'):'🔐 Conta local · Dados criptografados com sua senha'}</small></div></div><div class="btnrow">${account?.type==='cloud'?'<button class="secondary" data-sync>↗ Sincronizar progresso</button>':''}<button class="ghost" data-logout>⎋ Sair desta conta</button></div><p class="muted tiny">${account?.type==='cloud'?'Use o mesmo e-mail e senha em outros dispositivos. Você precisa de internet e de um Supabase configurado.':'Seu progresso fica neste dispositivo e neste navegador/app. Para mudar de aparelho, exporte um backup.'}</p></div><div class="card"><h3>💾 Backup e restauração</h3><p>O jogo salva automaticamente nesta conta. Exporte um backup para guardar fora do aplicativo.</p><div class="btnrow"><button class="primary" data-export>⬇ Exportar progresso</button><label class="secondary" style="display:inline-block;cursor:pointer">⬆ Importar backup<input type="file" id="importSave" accept=".json,application/json" style="display:none"></label></div><p class="muted tiny">O arquivo de backup exportado não é criptografado. Guarde-o em local privado. O arquivo importado substituirá o progresso da conta conectada.</p></div>${getOldSave()?`<div class="card"><h3>♻ Progresso da versão anterior</h3><p>Um salvamento antigo foi encontrado neste aparelho. A importação substitui o jogo atual nesta conta; faça backup antes.</p><button class="secondary" data-legacy>Importar progresso antigo</button></div>`:''}<div class="card"><h3>🧭 Novo império</h3><p>Crie um novo estúdio mantendo sua conta. Esta ação substitui o jogo salvo desta conta, mas não afeta os demais usuários.</p><button class="danger" data-reset>Reiniciar somente meu progresso</button></div><div class="card"><h3>ℹ Sobre</h3><p>Empire TV v2.0 é um jogo independente. Produza suas próprias histórias e acompanhe o mercado de televisão e cinema.</p><p>O login local usa criptografia AES-GCM com chave derivada da senha. O modo em nuvem é opcional e requer configuração de um backend; não há sincronização automática entre dispositivos no modo local.</p></div></div></section>`}
function render(){if(!account){root.innerHTML=authPage();return}if(!s){root.innerHTML=intro();return}const sections={home,shows,production,team,networks:networksPage,goals:goalsPage,company,end:endPage,settings};root.innerHTML=`<div class="app">${basic()}${tab==='home'?'':`<div class="topbar"><span class="welcome-line">✦ ${esc(s.name)} · SEMANA ${s.week} · ${accountMark()}</span><button class="small-btn" data-next-week>⏭ Avançar semana</button></div>`}${(sections[tab]||home)()}<p class="dev">Empire TV Beta · Jogo independente · Conta: ${esc(account?.username)}</p></div><nav class="nav" aria-label="Navegação">${tabButton('home','⌂','Início')}${tabButton('shows','▣','Séries')}${tabButton('production','▶','Produção')}${tabButton('team','♟','Equipe')}${tabButton('networks','◉','Emissoras')}${tabButton('goals','✦','Objetivos')}${tabButton('company','▤','Empresa')}</nav>`}
function doExport(){let str=JSON.stringify(s,null,2);if(window.AndroidBridge&&typeof window.AndroidBridge.saveBackup==='function'){let raw=new TextEncoder().encode(str),bin='';for(let i=0;i<raw.length;i+=8192)bin+=String.fromCharCode(...raw.subarray(i,i+8192));window.AndroidBridge.saveBackup(btoa(bin),'tv-empire-'+account.username+'-semana-'+s.week+'.json');notice('Escolha onde salvar o arquivo de backup.');return}let blob=new Blob([str],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tv-empire-semana-'+s.week+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);notice('Backup exportado. Guarde em local seguro.')}
function importBackup(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(!v||v.version!==VERSION||!Array.isArray(v.shows)||!Array.isArray(v.networks)||!Array.isArray(v.hired)||!v.counts||typeof v.cash!=='number')throw new Error('Formato inválido');if(!confirm('Substituir o progresso atual pelo backup importado?'))return;s=v;tab='home';currentEnd=null;save();render();notice('Backup importado com sucesso!')}catch(e){notice('Este arquivo não é um backup válido do jogo.',true)}};reader.readAsText(file)}

function talentCard(t,employed=false){return `<div class="card"><div class="between"><div><span class="tag">${esc(t.role)}</span><h3>${esc(t.name)}</h3></div><span class="pill ${employed?'green':'cyan'}">${t.skill} técnica</span></div><p>Especialidade: ${esc(t.genre)} · +12 técnica em obras desse gênero.</p><div class="mini-grid"><div>Salário semanal<strong>${money(t.salary)}</strong></div><div>Taxa de aparição<strong>${t.role==='Atuação'?t.chance+'%':'Sempre'}</strong></div></div><p class="tiny">${t.role==='Atuação'?'A taxa é a chance de estar disponível em cada ciclo de 5 min.':'Profissional de apoio; disponível em todos os ciclos.'} Quem já foi contratado permanece na equipe.</p><button class="${employed?'danger':'secondary'}" ${employed?`data-fire="${t.id}"`:`data-hire="${t.id}"`} style="margin-top:8px">${employed?'Dispensar':'Contratar · '+money(t.salary*2)}</button></div>`;}
function marketCards(){return talents.filter(t=>!s.hired.includes(t.id)&&availableTalent(t)).map(t=>talentCard(t)).join('')||'<div class="empty">Nenhum talento disponível neste ciclo. Aguarde a renovação.</div>';}
team=function(){return `<section class="section"><div class="head"><h2>Agência de talentos</h2><span class="pill orange">${money(hiredCost())}/semana</span></div><p class="subhead">Duas semanas de salário na contratação. A técnica melhora a produção; afinidade de gênero dá +12. Selecionar o protagonista influencia a gravação.</p><div class="info between wrap"><span>Lista renova a cada 5 minutos reais, inclusive com o jogo fechado.</span><b data-market-timer></b></div><details><summary>Quem pode aparecer? Consulte todas as probabilidades</summary><div class="scroll"><table class="table"><thead><tr><th>Ator</th><th>Chance por ciclo</th><th>Técnica</th><th>Gênero</th></tr></thead><tbody>${talents.filter(t=>t.role==='Atuação').map(t=>`<tr><td>${esc(t.name)}</td><td>${t.chance}%</td><td>${t.skill}</td><td>${esc(t.genre)}</td></tr>`).join('')}</tbody></table></div><p class="tiny">Probabilidade por ator, não porcentagem de exclusividade. Reabrir a tela não sorteia outra lista.</p></details><h3>Disponíveis agora</h3><div class="grid" id="market-list">${marketCards()}</div><h3 style="margin-top:24px">Sua equipe · ${s.hired.length}</h3><div class="grid">${hired().map(t=>talentCard(t,true)).join('')||'<div class="empty">Ainda não há profissionais contratados.</div>'}</div></section>`;};

function episodeReport(sh,ep){const legacy=!ep.comments;return `<article class="card report" id="report-${ep.id}"><div class="between wrap"><div><span class="tag">${unitLabel(sh,ep)} · SEMANA ${ep.airWeek}</span><h3>${esc(ep.title)}</h3><p>${esc(sh.name)} · ${esc(sh.genre)}</p></div><span class="pill ${ep.artificial?'orange':'cyan'}">${ep.artificial?'AVALIAÇÃO ARTIFICIAL':'RELATÓRIO DA EXIBIÇÃO'}</span></div><div class="report-metrics"><div>Visualizações<strong>${compact(ep.viewership)}</strong></div><div>Críticas enviadas<strong>${legacy?'Não registrado':compact(ep.reviewCount)}</strong></div><div>Gostei<strong>${legacy?'Não registrado':compact(ep.likes)}</strong></div><div>Favoritos<strong>${legacy?'Não registrado':compact(ep.favorites)}</strong></div></div><div class="mini-grid" style="margin-top:10px"><div>Nota dos críticos<strong>${ep.critics}/100</strong></div><div>Nota dos fãs<strong>${ep.viewers}/100</strong></div><div>Receita de exibição<strong>${legacy?'Não registrado':money(ep.revenue)}</strong></div><div>Receita − produção<strong>${legacy?'Não registrado':money(ep.netProduction)}</strong></div></div><p class="tiny muted">${legacy?'Save anterior à versão 3.0: as métricas que não existiam não foram inventadas.':'Críticas enviadas contam as avaliações simuladas; '+compact(ep.negativeReviews)+' delas foram negativas. Gostei e favoritos são contagens. O resultado desconta filmagem e divulgação, mas não salários e manutenção semanais.'}</p>${ep.comparison?`<div class="info">Comparado com “${esc(ep.comparison.title)}”: ${signed(ep.comparison.views)} visualizações · ${signed(ep.comparison.public)} pontos de fãs · ${signed(ep.comparison.critics)} pontos de crítica.</div>`:''}${ep.analysis?`<details><summary>Por que tive esse resultado? · análise de decisões</summary><p class="tiny">Notas simuladas pelo motor local a partir das decisões e dos sinais escritos. Cada detalhe abaixo registra a causa e uma direção de revisão.</p><div class="rows">${ep.analysis.map(f=>`<div class="analysis-row"><div class="between"><b>${f.label}</b><span class="pill ${f.score<60?'red':'green'}">${f.score}/100</span></div><p>${esc(f.evidence)}</p><p class="advice">Próximo teste: ${esc(f.advice)}</p></div>`).join('')}</div></details>`:''}${ep.distribution?`<details><summary>Como distribuição e dinheiro afetaram a obra</summary><p>${esc(ep.distribution.why)}</p><p>Alcance da rede: ×${ep.distribution.reach.toFixed(2)} · formato/plataforma: ×${ep.distribution.fit.toFixed(2)} · ${ep.distribution.trend?'gênero em alta: +20%':'sem bônus de tendência'} · ${ep.boostAudience?'impulso de audiência: +40%':'sem impulso de audiência'}.</p><p>Investimento de filmagem: ${money(ep.baseBudget)} · divulgação: ${money(ep.promo)} · custo total: ${money(ep.budget)}. Fãs conquistados: ${compact(ep.newFans)}.</p><p class="tiny">Receita parceira: licença contratada, com bônus de 16% para nota dos fãs ≥75. Rede própria: publicidade proporcional ao alcance.</p></details>`:''}<details ${s.difficulty==='director'?'open':''}><summary>Comentários da exibição · ${ep.comments?.length||2} destaques</summary><p class="tiny muted">Comunidade fictícia simulada. Os destaques não correspondem ao total de avaliações.</p><div class="comments">${ep.comments?.map(c=>`<div class="comment ${c.parent?'reply':''}"><div class="between"><b>@${esc(c.user)}</b><span class="tag">${c.role}</span></div><p>${esc(c.text)}</p><small>♡ ${compact(c.likes)}</small></div>`).join('')||`<div class="comment"><p>${esc(ep.reviewCritic)}</p></div><div class="comment"><p>${esc(ep.reviewFan)}</p></div>`}</div></details></article>`;}
episodeHistory=function(sh){return `<div class="line"></div><div class="rows">${sh.episodes.slice().reverse().map(ep=>ep.status==='aired'?episodeReport(sh,ep):`<div class="info">${esc(ep.title)} · ${unitLabel(sh,ep)} · estreia na semana ${ep.airWeek}. Qualidade prevista: ${ep.quality}/100.</div>`).join('')}</div>`;};

function inclusionProbabilities(pool){
 const result=new Map;let remaining=4,rest=pool.slice();
 while(rest.length){const sum=rest.reduce((v,t)=>v+t.weight,0),certain=rest.filter(t=>remaining*t.weight/sum>=1);
  if(!certain.length){rest.forEach(t=>result.set(t.id,remaining*t.weight/sum));break;}
  certain.forEach(t=>result.set(t.id,1));remaining-=certain.length;rest=rest.filter(t=>!certain.includes(t));
 }
 return result;
}
function rolePool(role){

 if(pool.length<4)pool=pool.concat(talents.filter(t=>t.trainee&&t.role===role&&!s.hired.includes(t.id)).slice(0,4-pool.length));

function marketCycle(epoch=marketEpoch()){

 if(marketCache?.key===cacheKey)return marketCache;
 const entries=[],odds={};
 for(const role of BETA_ROLES){
  const pool=rolePool(role),p=inclusionProbabilities(pool),rng=seeded(s.campaignId+'agency'+role+epoch),ordered=pool.map(t=>({t,sort:rng()})).sort((a,b)=>a.sort-b.sort).map(x=>x.t);
  const start=rng();let cumulative=0,pick=0;
  for(const t of ordered){const end=cumulative+p.get(t.id);odds[t.id]=p.get(t.id);
   if(pick<4&&start+pick<end-1e-10){entries.push(t);pick++;}
   cumulative=end;

function marketChance(t,epoch=marketEpoch()){return marketCycle(epoch).odds[t.id]||0;}

 if(!b||!account||!s)return;e.preventDefault();e.stopImmediatePropagation();if(aiBusy)return;
 try{
  if(b.hasAttribute('data-em-nav'))emGo(b.dataset.emNav);

  else if(b.hasAttribute('data-em-refresh-agency'))refreshAgency();

  else if(b.hasAttribute('data-em-analyse')){await analyseWork(Number(b.dataset.emAnalyse));workPanel='analysis';render();}
  else if(b.hasAttribute('data-em-sync')){if(serviceConfig()||automaticServiceEnabled())await syncUniverse(true);else{if(addAmbientLocal(Date.now(),true))save();render();notice('Conversa local atualizada.');}}

 }catch(error){hideSceneLoading();notice(error.message||'Não foi possível concluir a ação.',true);}

}

render=function(){mxRenderBase();if(s&&!campaignSetup){empirePlayMusic();if(!aiBusy&&empireAnalysisTasks.size&&root.querySelector){const stage=root.querySelector('#empire-stage');if(stage){const message=document.createElement('aside');message.className='mx-analysis-banner';message.textContent='Vant está analisando em segundo plano. Você pode continuar navegando.';stage.prepend(message);}}}};
const empireAnalysisTasks=new Map(),mxAnalyseBase=analyseWork;
analyseWork=async function(showId,...args){
 const key=account.id+':'+s.campaignId+':'+showId;
 if(empireAnalysisTasks.has(key))return empireAnalysisTasks.get(key);
 if(empireAnalysisTasks.size){if(args[3]===true)return null;throw Error('Outra análise está em andamento. Continue jogando e aguarde o resultado.');}
 const task=mxAnalyseBase(showId,...args);empireAnalysisTasks.set(key,task);
 try{return await task;}finally{empireAnalysisTasks.delete(key);if(!empireAnalysisTasks.size)aiBusy=false;render();}
};
const mxSceneBase=sceneLoadingView;
sceneLoadingView=function(label,progress=35,options={}){mxSceneBase(label,progress,options);if(options.kind==='analysis'&&!options.local&&motionDOM()){const card=document.querySelector('#scene-loading .em-loading-card');if(card){const button=document.createElement('button');button.type='button';button.className='ghost';button.textContent='Continuar jogando durante a análise';button.addEventListener('click',()=>{aiBusy=false;hideSceneLoading();render();});card.appendChild(button);}}};
root.addEventListener('click',async e=>{
 const b=e.target.closest('[data-mx]');if(!b||!s||!account)return;e.preventDefault();e.stopImmediatePropagation();const action=b.dataset.mx,value=b.dataset.value;
 try{
  empireSound('tap');
  if(action==='campus'){tab='home';subpage='campus';render();}
  else if(action==='audioStart'){empireAudio.enabled=true;localStorage.setItem('empire-audio',JSON.stringify(empireAudio));empirePlayMusic();render();notice('Trilha do estúdio ativada. Ajuste o volume em Configurações.');}
  else if(action==='room')upgradeRoom(value);
  else if(action==='workPanel'){workPanel=value;render();}
  else if(action==='train')trainEmployee(value);
  else if(action==='screen')screening(value);
  else if(action==='revise')reviseProduction(value);
  else if(action==='rerun')rerunWork(Number(value));
  else if(action==='batch')publishBatch(Number(value));
  else if(action==='cable')openNetwork('Cabo');
  else if(action==='loan')takeLoan(Number(value));
  else if(action==='repay')repayLoan(value);
  else if(action==='recover')recoverCompany();
  else if(action==='challenge')claimEmpireChallenge(value);
  else if(action==='guide'){
   const hint=contextualHelp();tab=hint.target;subpage=hint.sub;chosenShow=hint.show||null;s.vant.collapsed=false;s.vant.touring=false;render();
   const target=root.querySelector(hint.selector);if(target){target.classList.add('mx-guided');target.scrollIntoView?.({behavior:motionMode==='reduced'?'auto':'smooth',block:'center'});target.focus?.();}notice(hint.title+'. '+hint.text);voiceVant(hint.text);
  }else if(action==='diagnostics'){
   const text='Empire TV · '+EMPIRE_VERSION+' · revisão '+EMPIRE_REVISION+'\nSemana '+s.week+' · '+s.difficulty+'\nFinanceiro: '+(s.cash===s.finance.opening+s.finance.income-s.finance.expenses?'conciliado':'divergente')+'\nPúblico persistente: '+s.empire.audience.length+'\nEmissoras: '+Object.keys(s.market.networks).length;
   if(window.navigator?.clipboard)await window.navigator.clipboard.writeText(text);notice(text);
  }
 }catch(error){notice(error.message||'A ação não foi concluída.',true);}
},true);
root.addEventListener('submit',e=>{
 const form=e.target.closest('form[data-mx-form]');if(!form||!s||!account)return;e.preventDefault();e.stopImmediatePropagation();const fd=new FormData(form);
 try{
  const action=form.dataset.mxForm,actions={bible:saveBible,contract:selectContract,sponsor:sponsorWork,rights:sellRights,releasePolicy:setReleasePolicy,franchise:createFranchise,ending:planEnding,audition,support:supportCast,counteroffer:negotiateLicense,employment:setEmploymentTerm};
  if(actions[action])actions[action](fd);
  else if(action==='audio'){empireAudio={enabled:fd.get('enabled')==='on',effects:fd.get('effects')==='on',voice:fd.get('voice')==='on',volume:clamp(Number(fd.get('volume'))/100,0,.7)};localStorage.setItem('empire-audio',JSON.stringify(empireAudio));empirePlayMusic();render();notice('Preferências de áudio salvas.');voiceVant('Olá! Eu sou Vant, seu assistente. Vamos criar a próxima grande história.');}
 }catch(error){notice(error.message||'Não foi possível salvar.',true);}
},true);
if(typeof document.addEventListener==='function')document.addEventListener('visibilitychange',()=>{if(document.hidden){empireMusic?.pause();window.speechSynthesis?.cancel();}else empirePlayMusic();});

}

const VANT_FEATURE_GUIDES=Object.freeze(VANT_TOPICS.map(t=>t.id));

function vantLesson(id){return VANT_TOPICS.find(t=>t.id===id);}
function vantTutorialData(state=s){
 if(!state)return null;
 const e=empireData(state),old=e.tutorials;
 if(!old||typeof old!=='object'||Array.isArray(old))e.tutorials={version:1,automatic:true,progress:{}};
 const data=e.tutorials;data.version=1;data.automatic=data.automatic!==false;
 const original=data.progress&&typeof data.progress==='object'&&!Array.isArray(data.progress)?data.progress:{};
 const clean={};
 for(const t of VANT_TOPICS){const p=original[t.id];if(!p||p.version!==t.version)continue;
  clean[t.id]={version:t.version,index:clamp(Number.isInteger(p.index)?p.index:0,0,t.steps.length-1),finished:p.finished===true,postponed:p.postponed===true};
 }
 data.progress=clean;return data;
}
const vtMigrationBase=migrateFinal;
migrateFinal=function(state){vtMigrationBase(state);if(state)vantTutorialData(state);return state;};
function vantProgress(id,state=s){const t=vantLesson(id),data=vantTutorialData(state);return data?.progress[id]||{version:t?.version||1,index:0,finished:false,postponed:false};}
function vantRecord(id){const t=vantLesson(id);if(!t||!s)return null;const data=vantTutorialData();return data.progress[id]??={version:t.version,index:0,finished:false,postponed:false};}
function vantTutorialOwner(){return account&&s?account.id+':'+s.campaignId:'';}
function currentVantTopics(){
 if(!s||!account||campaignSetup)return[];
 return VANT_TOPICS.filter(t=>{
  const [page,sub,panel]=t.route;if(tab!==page)return false;
  if(page==='social')return true;
  if(subpage!==sub)return false;
  if(page==='shows'&&sub==='')return !!chosenShow&&panel===workPanel;
  if(page==='reports')return !!chosenReport&&panel===reportPanel;
  return true;
 });
}
function vantTutorialSummary(){const data=vantTutorialData();return{total:VANT_TOPICS.length,finished:VANT_TOPICS.filter(t=>data?.progress[t.id]?.finished).length};}
function vtSearchText(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR');}
function filteredVantTopics(){const q=vtSearchText(vtQuery);return VANT_TOPICS.filter(t=>(vtGroup==='all'||t.group===vtGroup)&&(vtFilter==='all'||(vantProgress(t.id).finished?vtFilter==='finished':vtFilter==='pending'))&&(!q||vtSearchText(t.title+' '+t.group+' '+t.steps.map(x=>x.body).join(' ')).includes(q)));}
function vtButton(label,action,id='',style='secondary'){return emButton(label,'data-vt="'+action+'" data-topic="'+esc(id)+'"',style,action==='open'?'play':'');}
function vantTutorialList(){const topics=filteredVantTopics();return topics.length?topics.map(t=>{const p=vantProgress(t.id);return '<article class="card vt-topic"><div class="between"><span class="eyebrow">'+esc(t.group)+'</span>'+pill(p.finished?'Concluído':p.index?'Em andamento':'Disponível',p.finished?'green':'cyan')+'</div><h3>'+esc(t.title)+'</h3><p>'+esc(t.steps[0].body)+'</p><small>'+t.steps.length+' passos · explicação sem gastar recursos</small>'+vtButton(p.finished?'Rever tutorial':p.index?'Continuar tutorial':'Começar tutorial','open',t.id)+'</article>';}).join(''):emEmpty('Nenhum tutorial encontrado','Tente outro termo ou remova um filtro.');}

 if(vtActive&&vtActive.owner!==vantTutorialOwner())vtActive=null;
 if(!root.insertAdjacentHTML)return;
 const prompt=vantTutorialPrompt(),stage=root.querySelector('#empire-stage');
 if(prompt&&stage){const heading=stage.querySelector('.em-page-head');if(heading)heading.insertAdjacentHTML('afterend',prompt);else stage.insertAdjacentHTML('afterbegin',prompt);}
 if(!vtActive)return;
 const t=vantLesson(vtActive.id),target=currentVantTopics().some(x=>x.id===t.id)?stage?.querySelector(t.target):null;
 if(target){target.classList.add('vt-highlight');vtActive.location='O controle desta função está destacado na página.';}
 root.insertAdjacentHTML('beforeend',vantTutorialMarkup());root.querySelector('.em-shell')?.setAttribute('inert','');
 if(focus)root.querySelector('#vt-next')?.focus();
}
function openVantTutorial(id){
 const t=vantLesson(id);if(!t||!s||!account)return false;
 if(s.vant.touring){notice('Termine a apresentação geral do Vant para abrir uma explicação específica.');return false;}
 const p=vantRecord(id);vtActive={id,index:p.finished?0:p.index,owner:vantTutorialOwner(),location:''};p.postponed=false;
 save();paintVantTutorials(true);voiceVant(t.title+'. '+t.steps[vtActive.index].body);return true;
}
function advanceVantTutorial(direction=1){
 if(!vtActive||vtActive.owner!==vantTutorialOwner())return false;const t=vantLesson(vtActive.id);
 const next=clamp(vtActive.index+direction,0,t.steps.length-1);vtActive.index=next;vantRecord(t.id).index=next;
 save();paintVantTutorials(true);voiceVant(t.steps[next].body);return true;
}
function pauseVantTutorial(){
 if(!vtActive)return false;
 if(vtActive.owner===vantTutorialOwner()){const p=vantRecord(vtActive.id);p.index=vtActive.index;p.postponed=true;save();}
 vtActive=null;window.speechSynthesis?.cancel();paintVantTutorials();
 if(vtReturnFocus?.isConnected)vtReturnFocus.focus();else root.querySelector('[data-vt-prompt] summary')?.focus();vtReturnFocus=null;return true;
}
function finishVantTutorial(){
 if(!vtActive||vtActive.owner!==vantTutorialOwner())return false;const t=vantLesson(vtActive.id);
 if(vtActive.index!==t.steps.length-1)return false;
 const p=vantRecord(t.id);p.finished=true;p.index=0;p.postponed=false;
 vtActive=null;window.speechSynthesis?.cancel();save();
 if(tab==='settings'&&subpage==='tutorials')render();else paintVantTutorials();
 const button=root.querySelector('[data-vt="open"][data-topic="'+t.id+'"]');button?.focus();vtReturnFocus=null;
 notice('Explicação concluída. Você pode revê-la nos Tutoriais de Vant.');return true;
}
function locateVantTutorial(){
 if(!vtActive||vtActive.owner!==vantTutorialOwner())return false;const t=vantLesson(vtActive.id),[page,sub,panel]=t.route;
 if(currentVantTopics().some(x=>x.id===t.id)){
  const target=root.querySelector('#empire-stage')?.querySelector(t.target);target?.scrollIntoView?.({block:'center',behavior:'auto'});
  if(!target)vtActive.location='O controle aparece quando os requisitos descritos nos passos estiverem cumpridos.';
  paintVantTutorials(true);return !!target;
 }
 let work=chosenShow?showBy(chosenShow):null,report=null;
 if(page==='shows'&&sub===''){work=work||s.shows[0];if(!work){vtActive.location='Primeiro crie uma obra no Catálogo. Você pode ler esta explicação agora.';paintVantTutorials(true);return false;}}
 if(page==='production'&&sub==='studio'){work=work||s.shows.find(sh=>sh.status==='active');if(!work){vtActive.location='Você precisa de uma obra com distribuição para usar a Sala de produção.';paintVantTutorials(true);return false;}}
 if(page==='reports'){for(const sh of s.shows){report=sh.episodes.find(ep=>ep.status==='aired'&&ep.id===chosenReport)||report;}if(!report)report=s.shows.flatMap(sh=>sh.episodes).find(ep=>ep.status==='aired');if(!report){vtActive.location='O relatório fica disponível depois de publicar uma produção.';paintVantTutorials(true);return false;}}
 tab=page;subpage=sub;menuOpen=false;chosenShow=work?.id||null;chosenReport=report?.id||null;
 if(page==='shows'&&panel)workPanel=panel;if(page==='reports'&&panel)reportPanel=panel;
 vtActive.location='Esta função fica nesta página. Se o controle ainda não aparece, confira os requisitos no tutorial.';render();
 const target=root.querySelector('#empire-stage')?.querySelector(t.target);target?.scrollIntoView?.({block:'center',behavior:'auto'});
 root.querySelector('#vt-next')?.focus();return true;
}
function resetVantTutorials(){const data=vantTutorialData();if(!data)return;data.progress={};vtActive=null;save();render();notice('Explicações reiniciadas. Sua campanha e suas missões foram preservadas.');}
const vtRenderBase=render;
render=function(){vtRenderBase();paintVantTutorials(!!vtActive);};
root.addEventListener('click',e=>{
 const b=e.target.closest('[data-vt]');if(!b||!account||!s)return;e.preventDefault();e.stopImmediatePropagation();
 const action=b.dataset.vt;if(action==='open')vtReturnFocus=b;
 if(action==='open')openVantTutorial(b.dataset.topic);
 else if(action==='next')advanceVantTutorial(1);
 else if(action==='previous')advanceVantTutorial(-1);
 else if(action==='pause')pauseVantTutorial();
 else if(action==='finish')finishVantTutorial();
 else if(action==='locate')locateVantTutorial();
 else if(action==='central'){tab='settings';subpage='tutorials';chosenShow=null;chosenReport=null;menuOpen=false;render();}
 else if(action==='reset')resetVantTutorials();
 else if(action==='postpone'){for(const t of currentVantTopics())vantRecord(t.id).postponed=true;save();paintVantTutorials();}
},true);
function updateVantTutorialList(){const list=root.querySelector('#vt-topic-list');if(list)list.innerHTML=vantTutorialList();}
root.addEventListener('input',e=>{if(!e.target.matches?.('[data-vt-search]'))return;vtQuery=e.target.value.slice(0,100);updateVantTutorialList();});
root.addEventListener('change',e=>{
 if(e.target.matches?.('[data-vt-auto]')){vantTutorialData().automatic=e.target.checked;save();}
 else if(e.target.name==='vtGroup'){vtGroup=e.target.value;updateVantTutorialList();}
 else if(e.target.name==='vtFilter'){vtFilter=e.target.value;updateVantTutorialList();}
});
if(document.addEventListener)document.addEventListener('keydown',e=>{
 if(!vtActive)return;
 if(e.key==='Escape'){e.preventDefault();pauseVantTutorial();return;}
 if(e.key!=='Tab')return;
 const dialog=root.querySelector('#vt-dialog');if(!dialog)return;
 const buttons=[...dialog.querySelectorAll('button:not([disabled]),[tabindex="0"]')],first=buttons[0],last=buttons.at(-1);
 if(!buttons.length)return;
 if(!dialog.contains(document.activeElement)){e.preventDefault();first.focus();}
 else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
 else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});
const vtNativeBack=window.EmpireNavigation.back;
window.EmpireNavigation.back=function(){if(vtActive)return pauseVantTutorial();return vtNativeBack();};

 e.preventDefault();e.stopImmediatePropagation();const fd=new FormData(form);

 else if(b.dataset.socialReport){tab='shows';subpage='';formDefaults.history=+b.dataset.socialReport;render();const target=root.querySelector('#report-'+showBy(b.dataset.socialReport)?.episodes.filter(e=>e.status==='aired').at(-1)?.id);if(target)target.scrollIntoView({behavior:'smooth',block:'start'});else window.scrollTo(0,0);}
},true);
root.addEventListener('click',e=>{if(!menuOpen||e.target.closest('.beta-nav,.menu-trigger'))return;menuOpen=false;const panel=root.querySelector('#beta-menu'),button=root.querySelector('[data-toggle-menu]');if(panel)panel.hidden=true;if(button)button.setAttribute('aria-expanded','false');});

root.addEventListener('change',e=>{
 if(e.target.name==='actor'){const form=e.target.closest('form'),sh=showBy(form?.dataset.preview);if(sh){const credits=crewSnapshot(sh,e.target.value),panel=root.querySelector('[data-crew-preview="'+sh.id+'"]');if(panel)panel.innerHTML='<b>Impacto previsto da equipe</b><p>Fama: +'+Math.round((fameMultiplier(credits)-1)*100)+'% no alcance potencial.</p><p>'+credits.map(c=>esc(c.role)+': <b>'+esc(c.name)+'</b> · '+c.technique+' técnica, '+c.fame+' fama').join('<br>')+'</p>';}}
 if(!e.target.matches('[data-pitch-preview]'))return;const sh=showBy(e.target.dataset.pitchPreview),n=networkBy(e.target.value),form=e.target.closest('form');if(!sh||!n||!form)return;
 const p=pitchPreview(sh,n),info=form.querySelector('[data-pitch-info]');if(info)info.textContent=n.name+': '+p.why+' Chance '+p.chance+'%. Licença '+money(p.fee)+(isFilm(sh)?' pelo filme.':' por episódio.');

},1000);
const betaSafeStateBase=safeState;
safeState=function(v){return betaSafeStateBase(v)&&Number.isFinite(v.week)&&v.week>=1&&Number.isFinite(v.level)&&v.level>=1&&v.upgrades&&typeof v.upgrades==='object'&&Array.isArray(v.ledger)&&Array.isArray(v.feed)&&Array.isArray(v.history)&&v.boosts&&v.shows.every(sh=>sh&&typeof sh.name==='string'&&Number.isFinite(sh.id)&&genres.includes(sh.genre)&&Array.isArray(sh.episodes)&&sh.episodes.every(ep=>ep&&Number.isFinite(ep.id)&&Number.isFinite(ep.budget)&&['produced','aired'].includes(ep.status)));};
importBackup=function(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{
 try{const state=JSON.parse(reader.result);if(!safeState(state))throw Error('Formato inválido');if(!confirm('Substituir a campanha desta conta pelo backup importado?'))return;
  migrateBeta(state);s=state;tab='home';subpage='';menuOpen=false;campaignSetup=false;currentEnd=null;save();render();notice('Backup importado. Patrimônio, equipe e exibições preservados.');
 }catch(error){notice('Arquivo inválido. Escolha um backup JSON exportado pelo jogo.',true);}
};reader.readAsText(file);};


root.addEventListener('submit',e=>{let form=e.target.closest('form[data-action]');if(!form)return;e.preventDefault();let data=new FormData(form),action=form.dataset.action;
if(action==='auth'){accountSubmit(data,authView);return}
if(action==='cloudConfig'){try{updateCloudConfig(data)}catch(e){notice(uiError(e),true)}return}
if(!account)return;
switch(action){case'start':startGame(String(data.get('name')||''));break;case'createShow':createShow(data);break;case'produce':produce(data);break;case'schedule':scheduleShow(data);break;case'boost':assignBoost(data);break;}});
root.addEventListener('click',async e=>{
const b=e.target.closest('button[data-auth-view],button[data-provider],button[data-visibility],[data-cloud-setup],[data-logout],[data-legacy],[data-sync],[data-tab],[data-next-week],[data-pitch],[data-hire],[data-renew],[data-end],[data-history],[data-produce-tab],[data-upgrade],[data-open-network],[data-pause-network],[data-export],[data-reset]');if(!b)return;
if(b.dataset.authView){authView=b.dataset.authView;render();return}
if(b.dataset.provider){authMode=b.dataset.provider;render();return}
if(b.hasAttribute('data-visibility')){let p=document.querySelector('#auth-pass');if(p){p.type=p.type==='password'?'text':'password';b.textContent=p.type==='password'?'Mostrar':'Ocultar'}return}
if(b.hasAttribute('data-cloud-setup')){cloudSetupOpen=!cloudSetupOpen;render();return}
if(b.hasAttribute('data-logout')){await signOut();return}
if(b.hasAttribute('data-legacy')){await importLegacy();return}
if(b.hasAttribute('data-sync')){save();await saveChain;render();notice(syncStatus==='cloud'?'Progresso sincronizado!':'Sincronização pendente. Verifique a internet.',syncStatus!=='cloud');return}
if(!account||!s)return;
if(b.dataset.tab){tab=b.dataset.tab;formDefaults={};render();window.scrollTo(0,0)}
else if(b.hasAttribute('data-next-week')){nextWeek();window.scrollTo(0,0)}
else if(b.dataset.pitch){pitch(b.dataset.pitch,b.dataset.network)}
else if(b.dataset.hire){hireTalent(b.dataset.hire)}
else if(b.dataset.renew){renew(b.dataset.renew)}
else if(b.dataset.end){if(confirm('Finalizar esta obra? Você poderá desenvolver uma continuação.'))endShow(b.dataset.end)}
else if(b.dataset.history){let ident=+b.dataset.history;formDefaults.history=formDefaults.history===ident?0:ident;render()}
else if(b.dataset.produceTab){tab='production';render();let target=document.querySelector('#production-'+b.dataset.produceTab);if(target)target.scrollIntoView({behavior:'smooth',block:'start'})}
else if(b.dataset.upgrade){upgrade(b.dataset.upgrade)}
else if(b.dataset.openNetwork){openNetwork(b.dataset.openNetwork)}
else if(b.dataset.pauseNetwork){toggleNetwork(b.dataset.pauseNetwork)}
else if(b.hasAttribute('data-export')){doExport()}
else if(b.hasAttribute('data-reset')){
 if(confirm('Apagar o progresso DESTA conta? Outros perfis não serão afetados. Faça um backup antes.')){

  if(account.type==='cloud')try{await cloudFetch('/rest/v1/game_saves?user_id=eq.'+encodeURIComponent(account.id),'DELETE')}catch(e){notice('Não foi possível apagar os dados na nuvem: '+uiError(e),true);return}
  try{localStorage.removeItem(STORAGE_PREFIX+(account.type==='cloud'?'cloud_':'')+account.id)}catch(e){}
  s=null;tab='home';currentEnd=null;render();notice('Seu jogo foi reiniciado. A conta permanece ativa.');
 }
}
