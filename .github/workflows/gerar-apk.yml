name: Gerar APK Empire TV

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Node 24 para os testes
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Localizar o projeto beta
        shell: bash
        run: |
          set -euo pipefail
          BETA_ZIP="Empire_TV_1.0.0.1_BETA_Projeto_APK.zip"
          if [ -f "$BETA_ZIP" ]; then
            BETA_STAGE="$RUNNER_TEMP/empire-tv-project"
            mkdir -p "$BETA_STAGE"
            unzip -oq "$BETA_ZIP" -d "$BETA_STAGE"
            BETA_SETTINGS=$(find "$BETA_STAGE" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          elif [ -f app/src/main/assets/index.html ] && [ -f settings.gradle ]; then
            BETA_SETTINGS="./settings.gradle"
          else
            echo "::error::Envie $BETA_ZIP à raiz do repositório, sem extrair nem renomear."
            exit 1
          fi
          if [ -z "$BETA_SETTINGS" ]; then
            echo "::error::Projeto Gradle não encontrado."
            exit 1
          fi
          echo "BETA_PROJECT_DIR=$(dirname "$BETA_SETTINGS")" >> "$GITHUB_ENV"

      - name: Verificar lógica do jogo
        shell: bash
        run: |
          cd "$BETA_PROJECT_DIR"
          python3 build-app.py
          node --check tests/script-check.cjs
          node tests/test-game.cjs
          node --test server/tests/*.test.mjs
          npm ci --prefix tests
          node tests/test-startup.cjs

      - name: Compilar APK
        shell: bash
        run: |
          cd "$BETA_PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir o APK e verificar se continua funcionando
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: python3 "$BETA_PROJECT_DIR/tests/test-apk-startup.py" "$BETA_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" --output "$GITHUB_WORKSPACE/apk-startup-diagnostics"

      - name: Guardar diagnóstico da abertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Empire-TV-Diagnostico-Abertura
          path: apk-startup-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preparar download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-download
          cp "$BETA_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" apk-download/Empire-TV-1.0.0.1-BETA.apk

      - name: Disponibilizar APK Empire TV
        uses: actions/upload-artifact@v7
        with:
          name: Empire-TV-1.0.0.1-BETA-APK
          path: apk-download/Empire-TV-1.0.0.1-BETA.apk
          if-no-files-found: error
          retention-days: 30
